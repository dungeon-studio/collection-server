# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "18 10 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 90
          days-before-close: 90
          stale-issue-message: >
            This issue has not had any activity in the past 90 days and will be
            closed in 90 days if no further activity occurs. Please feel free to
            reopen the issue if you are still facing the issue.
          stale-pr-message: >
            This pull request has not had any activity in the past 90 days and
            will be closed in 90 days if no further activity occurs. Please feel
            free to reopen the pull request if you are still facing the issue.
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          ascending: true
